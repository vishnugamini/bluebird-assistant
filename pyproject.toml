[project]
name = "bluebird-assistant"
version = "0.1.0"
description = "Proactive Hermes assistant with cloud and local model routing"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx[socks]>=0.28,<0.29",
  "google-auth>=2.38,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-cloud-storage>=3,<4",
  "apscheduler>=3.11,<4",
  "pyyaml>=6,<7",
  "ddgs>=9,<10",
]

[project.scripts]
a3 = "assistant.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant", "skill_tap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
